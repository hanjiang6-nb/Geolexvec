[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolexvec-main-experiment"
version = "1.0.0"
description = "Reproduction code for the main GeoLexVec retrieval experiment"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.15.3",
]

[tool.setuptools.packages.find]
include = ["geolexvec*", "rag_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
