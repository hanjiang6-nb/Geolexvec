name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/verify_release.py
      - run: pytest
      - run: python scripts/reproduce_tables.py --iterations 100 --out-dir ci_reproduced_tables
